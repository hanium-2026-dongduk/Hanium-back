name: CD

# main CI가 성공한 뒤에만 자동 배포한다. 장애 복구나 같은 버전 재배포를 위해
# Actions 화면에서 수동 실행도 허용한다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: EC2 배포
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}

    steps:
      - name: 필수 Secret 확인
        shell: bash
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Environment production에 $name Secret을 등록하세요."
              exit 1
            fi
          done

      - name: SSH 설정
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: main 무중단 배포
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$EC2_SSH_PORT" \
            "$EC2_USER@$EC2_HOST" \
            'cd ~/hanium-back && bash deploy/deploy.sh main'

      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" \
            --body "CD 배포가 실패했습니다: $RUN_URL"
