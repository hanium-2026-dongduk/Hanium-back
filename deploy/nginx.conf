# Nginx 리버스 프록시 설정 (Week 4 — EC2 배포).
#
# 앱은 3000번 포트에서만 듣고, 외부에는 Nginx가 80/443으로 노출한다.
# 이렇게 하는 이유:
#   - Node가 443을 직접 열려면 root 권한이 필요하다
#   - SSL 종료·gzip·정적 파일 처리를 Nginx가 대신한다
#   - 앱을 재시작하는 동안에도 Nginx가 502를 돌려주며 살아 있다
#
# 설치:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hanium-api
#   sudo ln -sf /etc/nginx/sites-available/hanium-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 아래 server_name을 실제 도메인으로 바꿔야 한다. 도메인이 아직 없으면 `_`로 두면
#    EC2 퍼블릭 IP로 접근된다(이 경우 SSL은 붙일 수 없다 — certbot이 도메인을 요구한다).

upstream hanium_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # ← 도메인이 생기면 여기에 넣는다 (예: api.example.com)

    # certbot이 도메인 소유를 확인할 때 쓰는 경로. SSL을 붙일 계획이면 남겨둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 업로드 본문 상한. 지금은 JSON만 받으므로 작게 잡는다.
    client_max_body_size 2m;

    # 서버 버전 노출 차단
    server_tokens off;

    # 프록시 자체가 오래 걸리는 요청(AI 생성 등)을 끊지 않도록 여유를 준다.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://hanium_api;
        proxy_http_version 1.1;

        # 앱이 실제 클라이언트 IP를 알 수 있게 한다. 나중에 IP 기준 rate limit을 넣을 때 필요하다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 앱 재시작(PM2 reload) 중 잠깐 연결이 끊겨도 다음 워커로 다시 시도한다.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # 헬스체크는 로그를 남기지 않는다(모니터링이 자주 호출해 로그가 넘친다).
    location = /api/health {
        proxy_pass http://hanium_api;
        proxy_set_header Host $host;
        access_log off;
    }

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
}

# ── SSL (도메인이 생긴 뒤) ────────────────────────────────────────────────────
#
# certbot을 돌리면 아래 블록을 자동으로 만들어 주므로 직접 쓸 필요는 없다.
#
#   sudo certbot --nginx -d api.example.com
#
# certbot이 하는 일:
#   1. 위 server 블록의 server_name으로 도메인 소유를 확인
#   2. 인증서를 발급받아 /etc/letsencrypt/에 저장
#   3. 443 server 블록을 추가하고 80은 443으로 리다이렉트하도록 이 파일을 수정
#   4. 갱신용 systemd 타이머를 등록(90일마다 자동 갱신)
#
# 인증서 갱신이 실제로 되는지는 아래로 확인한다:
#   sudo certbot renew --dry-run
